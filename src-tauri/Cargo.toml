[package]
name = "vellum"
version = "0.1.0"
description = "Vellum — terminal + reactive spec/git visualizer"
authors = ["Mithun Chavan"]
edition = "2021"

[lib]
name = "vellum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
notify = "6"
git2 = "0.19"
base64 = "0.22"
